name: datosapi

services:
  mongo:
    image: mongo:7
    container_name: datosapi-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-datosapi}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-datosapi}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--username',
          '${MONGO_ROOT_USER:-datosapi}',
          '--password',
          '${MONGO_ROOT_PASSWORD:-change_me}',
          '--authenticationDatabase',
          'admin',
          '--eval',
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - datosapi

volumes:
  mongo_data:

networks:
  datosapi:
    driver: bridge
